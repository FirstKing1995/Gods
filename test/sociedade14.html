<!doctype html><html><head><meta charset="utf-8"><title>Sociedade da Etapa 14</title>
<style>body{margin:0;background:#262b44;color:#ead4aa;font:12px monospace} canvas{image-rendering:pixelated;display:block}</style></head>
<body><canvas id="sheet"></canvas>
<script src="../js/core.js"></script><script src="../js/config.js"></script><script src="../js/world.js"></script>
<script src="../js/sim.js"></script><script src="../js/family.js"></script><script src="../js/life.js"></script><script src="../js/tech.js"></script><script src="../js/invencoes.js"></script>
<script src="../js/obras.js"></script><script src="../js/fauna.js"></script><script src="../js/bichos.js"></script><script src="../js/campo.js"></script><script src="../js/ai.js"></script>
<script src="../js/god.js"></script><script src="../js/deus.js"></script><script src="../js/narrator.js"></script><script src="../js/povos.js"></script><script src="../js/minas.js"></script><script src="../js/memoria.js"></script><script src="../js/sociedade.js"></script><script src="../js/save.js"></script>
<script src="../js/art.js"></script>
<script>
// folha da Etapa 14: a vila de fora (com gente e vazia) e os ícones da Sociedade (o bastão do líder, a balança do
// julgamento, a máscara do que o povo viu, o olho do que só Deus viu, a marca, a mão do perdão, a vila, as pegadas de
// quem vai embora, o fogo posto e o sonho), sobre a grama, a neve e a noite. ?z=6 muda o zoom
const q = new URLSearchParams(location.search);
const Z = +(q.get('z') || 5);
const A = G.Art;
const W = 1100, H = 700;
const sh = document.getElementById('sheet'); sh.width = W; sh.height = H;
const x = sh.getContext('2d'); x.imageSmoothingEnabled = false;
const ICS = ['lider', 'julg', 'crime', 'olho', 'marca', 'perdao', 'vila', 'partida', 'fogoposto', 'sonho'];
const bands = [['#58a447', 'grama'], ['#dfe6f0', 'neve'], ['#1d2238', 'noite']];
let py = 0;
function label(t, y, col) { x.fillStyle = 'rgba(24,20,37,0.78)'; x.fillRect(0, y, W, 16); x.fillStyle = col || '#ead4aa'; x.font = '12px monospace'; x.textBaseline = 'top'; x.fillText(t, 8, y + 2); }
for (const [col, nome] of bands) {
  x.fillStyle = col; x.fillRect(0, py, W, 180);
  label('a vila de fora (com gente, vazia) · os ícones no mapa: ' + ICS.join(', ') + ' · ' + nome, py);
  let px = 14; const base = py + 165;
  for (const vazia of [false, true]) { const img = A.vilaFora(vazia); x.drawImage(img, px, base - img.height * Z, img.width * Z, img.height * Z); px += img.width * Z + 24; }
  for (const n of ICS) { const ic = A.icon(n); x.drawImage(ic, px, base - ic.height * 4 - 30, ic.width * 4, ic.height * 4); px += 56; }
  py += 180;
}
// os ícones em 2x, como aparecem nos painéis, e em 3x
x.fillStyle = '#181425'; x.fillRect(0, py, W, H - py);
label('ícones em 2x (painéis, sobre o fundo escuro das listas) e em 3x', py);
let ix = 14;
for (const n of ICS) { const ic = A.icon(n); x.drawImage(ic, ix, py + 30, ic.width * 2, ic.height * 2); x.drawImage(ic, ix, py + 70, ic.width * 3, ic.height * 3); x.fillStyle = '#8b9bb4'; x.fillText(n, ix, py + 110); ix += 90; }
</script></body></html>
